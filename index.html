<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Saya - Neon Dark</title>
    <!-- Mengambil font dari Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- RESET DASAR --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* --- VARIABEL WARNA --- */
        :root {
            --bg-color: #0a0a0a;         /* Latar belakang sangat gelap */
            --card-bg: #121212;          /* Sedikit lebih terang dari bg */
            --neon-purple: #d300ff;       /* Warna Ungu Neon Utama */
            --neon-glow: #a500c7;        /* Warna glow lebih gelap */
            --text-white: #f0f0f0;       /* Putih bersih untuk teks */
            --text-gray: #aaaaaa;        /* Abu-abu untuk teks sekunder */
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- KARTU PROFIL --- */
        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 20px rgba(211, 0, 255, 0.1); /* Efek bayangan-redup */
            border: 1px solid #222;
        }

        /* --- FOTO PROFIL --- */
        .profile-img-container {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--neon-purple);
            /* Efek Neon bersinar di sekitar foto */
            box-shadow: 0 0 15px var(--neon-purple), 0 0 30px var(--neon-purple); 
        }

        /* --- TEKS --- */
        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: var(--text-white);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .tagline {
            color: var(--neon-purple);
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px var(--neon-purple); /* Efek text glow */
        }

        .bio {
            color: var(--text-gray);
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* --- TOMBOL KONTAK --- */
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: transparent;
            color: var(--neon-purple);
            border: 2px solid var(--neon-purple);
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 0.8rem;
            cursor: pointer;
        }

        /* Efek Hover Tombol (Jadi terang penuh) */
        .btn:hover {
            background: var(--neon-purple);
            color: white;
            box-shadow: 0 0 20px var(--neon-purple);
        }

        /* --- MEDIA QUERY (Responsif HP) --- */
        @media (max-width: 400px) {
            .container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-img-container">
            <!--https://files.catbox.moe/3kin5e.jpg-->
            <img src="https://files.catbox.moe/3kin5e.jpg" alt="Foto Profil" class="profile-img">
        </div>

        <h1>Xyzo skibidi</h1>
        <p class="tagline">Web Designer | Content Creator</p>

        <p class="bio">
            Halo! Saya seorang kreator digital yang suka dengan estetika gelap dan futuristik. Selamat datang di portofolio sederhana saya.
        </p>

        <!-- https://wa.me/+584261152829-->
        <a href="https://wa.me/+584261152829" class="cta-button"><i class=fas "fa-phone"></i>chat me</a>
    </div>

</body>
</html>
